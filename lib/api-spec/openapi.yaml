        jobId:
          type: integer
          nullable: true
        subscriptionId:
          type: integer
          nullable: true
        vaultSubscriptionId:
          type: integer
          nullable: true
        serverCredentialId:
          type: integer
          nullable: true
        stripePaymentIntentId:
          type: string
          nullable: true
        stripeInvoiceId:
          type: string
          nullable: true
        stripeChargeId:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Payout:
      type: object
      required: [id, serverId, userId, jobId, amountCents, currency, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        serverId:
          type: integer
        userId:
          type: string
        jobId:
          type: integer
        amountCents:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [pending, in_transit, paid, failed]
        stripeTransferId:
          type: string
          nullable: true
        stripeAccountId:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Wallet:
      type: object
      required:
        - paidCents
        - pendingCents
        - failedCents
        - platformFeeRate
        - payoutsEnabled
        - hasStripeAccount
        - connectAvailableCents
        - recentPayouts
      properties:
        paidCents:
          type: integer
          description: Lifetime paid-out cents to this server.
        pendingCents:
          type: integer
          description: Cents queued (pending or in-transit) but not yet paid.
        failedCents:
          type: integer
          description: |
            Cents that have a failed Stripe transfer attempt and need
            attention. Surfaced separately from `pendingCents` so the wallet
            UI can call out money that won't move on its own.
        platformFeeRate:
          type: number
          description: Platform fee fraction (server keeps 1 - platformFeeRate).
        payoutsEnabled:
          type: boolean
          description: True iff the server's Stripe Connect account is fully onboarded.
        hasStripeAccount:
          type: boolean
          description: True if any Stripe Connect account exists, even if not fully onboarded.
        connectAvailableCents:
          type: integer
          description: |
            Cents currently available in the server's Stripe Connect
            account that can be paid out *right now* via "Pay Now".
            Distinct from `pendingCents` (which counts SERVED.-side
            transfers, including ones still in Stripe's holding period).
        payoutSchedule:
          type: object
          nullable: true
          required: [interval]
          description: |
            Active Stripe payout schedule on the connected account.
            Defaults to weekly/Friday for new servers. Null if we couldn't
            fetch it from Stripe.
          properties:
            interval:
              type: string
              description: One of "manual", "daily", "weekly", "monthly".
            weeklyAnchor:
              type: string
              nullable: true
              description: Day of week for weekly interval (e.g. "friday").
            monthlyAnchor:
              type: integer
              nullable: true
              description: Day of month for monthly interval (1-31).
            delayDays:
              type: integer
              nullable: true
              description: Stripe holding period before funds become available.
        recentPayouts:
          type: array
          description: Most recent 50 payout rows (newest first).
          items:
            $ref: '#/components/schemas/PayoutRow'
        nextPayoutArrivalDate:
          type: string
          format: date-time
          nullable: true
          description: |
            Best-effort ETA for when the server's next pending transfer will
            land in their bank account. Sourced from the connected Stripe
            account's payout schedule (delay_days). Null when there is no
            pending balance.
        lifetimeJobsCompleted:
          type: integer
          description: |
            Total jobs this server has fully completed (status = "served").
            Powers the Career Pipeline counter on the server wallet.
        lifetimeEarningsCents:
          type: integer
          description: |
            Total cents this server has earned across every served job
            (sum of `serverPayoutCents` on completed jobs). Includes
            paid + pending + in-transit; mirrors the Career Pipeline total.

    PayoutRow:
      type: object
      required: [id, jobId, amountCents, status, createdAt]
      properties:
        id:
          type: integer
        jobId:
          type: integer
        amountCents:
          type: integer
        status:
          type: string
          enum: [pending, in_transit, paid, failed]
        paidAt:
          type: string
          format: date-time
          nullable: true
        arrivalDate:
          type: string
          format: date-time
          nullable: true
          description: |
            Expected (or actual, post-payout) date the funds will arrive in
            the server's bank account. Captured from the connected account's
            payout schedule when the Stripe transfer was created.
        createdAt:
          type: string
          format: date-time
        stripeTransferId:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
          description: |
            Short, human-readable reason populated when this row's Stripe
            transfer failed. Typically a Stripe error code plus truncated
            message. Only set when `status === "failed"`.

    ServerStatus:
      type: object
      required: [credentialing, payouts, serverStatus, canAcceptJobs, trainingCompletedAt]
      properties:
        credentialing:
          type: object
          required: [status, hasRow]
          properties:
            status:
              type: string
              nullable: true
              enum: [unpaid, pending, verified, failed]
            verifiedAt:
              type: string
              format: date-time
              nullable: true
            failureReason:
              type: string
              nullable: true
            hasRow:
              type: boolean
        trainingCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Timestamp the server finished the in-portal onboarding training
            video. Null until they hit "Mark training complete" on the
            Training tab. Job-claim endpoint rejects with `training_required`
            while this is null.
        payouts:
          type: object
          required: [hasStripeAccount, payoutsEnabled]
          properties:
            hasStripeAccount:
              type: boolean
            payoutsEnabled:
              type: boolean
        serverStatus:
          type: string
          enum: [pending, active, suspended, inactive]
          description: |
            Account lifecycle. Only `active` servers can accept jobs;
            `suspended` and `inactive` show a tailored blocked banner.
        licenseExpiry:
          type: string
          format: date
          nullable: true
          description: |
            Driver's license expiration date (admin-captured). Used by the
            UI to nudge servers when expiry is within 30 days.
        canAcceptJobs:
          type: boolean
          description: Convenience flag — true iff serverStatus === active AND verified AND payoutsEnabled.

    CredentialingCheckoutResponse:
      type: object
      required: [url, sessionId]
      properties:
        url:
          type: string
          nullable: true
        sessionId:
          type: string

    InstantPayoutResponse:
      type: object
      required: [payoutId, amountCents, status]
      properties:
        payoutId:
          type: string
          description: Stripe payout id (po_…) on the connected account.
        amountCents:
          type: integer
          description: Amount paid out in cents.
        arrivalDate:
          type: string
          format: date-time
          nullable: true
          description: Stripe's estimated bank arrival timestamp.
        status:
          type: string
          description: Stripe payout status (pending/in_transit/paid/failed/canceled).

    ConnectOnboardResponse:
      type: object
      required: [url, accountId]
      properties:
        url:
          type: string
        accountId:
          type: string

    ConnectRefreshResponse:
      type: object
      required: [payoutsEnabled, stripeAccountId, detailsSubmitted, requirementsCount]
      properties:
        payoutsEnabled:
          type: boolean
        stripeAccountId:
          type: string
        detailsSubmitted:
          type: boolean
        requirementsCount:
          type: integer

    ConnectDashboardLoginResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    AdminFailServerBody:
      type: object
      properties:
        reason:
          type: string

    AdminVerifyServerResponse:
      type: object
      required: [credential, serverId]
      properties:
        credential:
          $ref: '#/components/schemas/ServerCredential'
        serverId:
          type: integer

    ProServeCheckoutBody:
      type: object
      required: [tier]
      properties:
        tier:
          type: string
          enum: [solo, firm, firm_pro]

    VaultCheckoutBody:
      type: object
      required: [tier]
      properties:
        tier:
          type: string
          enum: [basic, legal, pro]

    CheckoutOrSwitchResponse:
      type: object
      required: [mode]
      description: |
        `mode: "checkout"` means the caller has no active sub of this kind — `url`
        is a Stripe-hosted Checkout Session to redirect to. `mode: "switched"`
        means an active sub already existed and the plan was updated in place
        (no redirect needed); the new tier is reflected via the existing
        `/me/subscription` or `/me/vault-subscription` endpoint.
      properties:
        mode:
          type: string
          enum: [checkout, switched]
        url:
          type: string
          nullable: true
          description: Present when `mode === "checkout"`.
        tier:
          type: string
          description: Tier the caller now holds (present when `mode === "switched"`).

    PortalSessionResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    DraftJobsCheckoutBody:
      type: object
      required: [jobIds]
      properties:
        jobIds:
          type: array
          items:
            type: integer
          minItems: 1
          maxItems: 50
          description: |
            Ids of draft jobs to pay for in a single Checkout session. All
            ids must belong to the calling attorney and currently be in
            `draft` status.
        queueId:
          type: integer
          nullable: true
          description: |
            Optional id of a `DraftCheckoutQueue` row this batch belongs
            to. When supplied, the webhook will atomically increment the
            queue's `paidCount` once Stripe confirms the session, so the
            resume banner advances on its own and the next batch is ready
            without any client-side bookkeeping.

    DraftJobsCheckoutResponse:
      type: object
      required: [url, sessionId, totalCents]
      properties:
        url:
          type: string
          description: Hosted Stripe Checkout URL to redirect the attorney to.
        sessionId:
          type: string
        totalCents:
          type: integer
          description: Sum of `grossCents` across all included jobs (display only).

    DraftCheckoutQueue:
      type: object
      required:
        - id
        - chunks
        - paidCount
        - totalCents
        - expiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        chunks:
          type: array
          description: |
            Ordered batches of draft job ids. The next batch to pay is
            `chunks[paidCount]`. Chunks already fully paid have been
            pruned by the server before this response is returned.
          items:
            type: array
            items:
              type: integer
        paidCount:
          type: integer
          description: |
            Number of leading chunks that have already been paid for.
            Always `< chunks.length` for an active queue.
        totalCents:
          type: integer
          description: Sum of `grossCents` across all chunks at queue creation time.
        expiresAt:
          type: string
          format: date-time
          description: Hard TTL — the queue stops being shown after this time.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpsertDraftCheckoutQueueBody:
      type: object
      required: [chunks, totalCents]
      properties:
        chunks:
          type: array
          minItems: 2
          description: |
            Ordered batches of draft job ids. Must contain at least two
            chunks — a single-chunk selection doesn't need a queue
            because there is nothing to resume after the one Checkout
            session completes.
          items:
            type: array
            items:
              type: integer
            minItems: 1
            maxItems: 50
        totalCents:
          type: integer
          description: Display-only total in cents across all chunks.

    DismissedResponse:
      type: object
      required: [dismissed]
      properties:
        dismissed:
          type: boolean

    ServePricePreview:
      type: object
      required:
        - serviceType
        - pricingTier
        - tierLabel
        - grossCents
        - formattedAmount
        - isSubscriber
        - publicGrossCents
      properties:
        serviceType:
          type: string
          enum: [standard, rush, licensed]
        pricingTier:
          type: string
          enum: [public, solo, firm, firm_pro]
        tierLabel:
          type: string
          description: Human-readable label, e.g. "Public" or "ProServe Solo".
        grossCents:
          type: integer
          description: Live per-serve price in cents for the caller.
        formattedAmount:
          type: string
          description: Display-formatted USD string, e.g. "$75".
        isSubscriber:
          type: boolean
          description: True when the caller has an active ProServe subscription.
        publicGrossCents:
          type: integer
          description: |
            Public (non-subscriber) per-serve price in cents for the same
            service type. Used by the UI to render an upsell delta.

    PublishLocationBody:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyM:
          type: number
          format: double
          description: Reported GPS accuracy in meters.
        headingDeg:
          type: number
          format: double
          description: Compass heading in degrees clockwise from north.
        speedMps:
          type: number
          format: double
          description: Reported speed in meters per second.

    JobLocationPing:
      type: object
      required: [lat, lng, recordedAt, ageSeconds]
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracyM:
          type: number
          format: double
          nullable: true
        headingDeg:
          type: number
          format: double
          nullable: true
        speedMps:
          type: number
          format: double
          nullable: true
        recordedAt:
          type: string
          format: date-time
        ageSeconds:
          type: integer
          description: Seconds elapsed between recordedAt and the response.

    JobLatestLocation:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: integer
        status:
          type: string
          enum: [in_progress, en_route]
        location:
          oneOf:
            - $ref: "#/components/schemas/JobLocationPing"
            - type: "null"
        destination:
          type: object
          nullable: true
          description: Recipient address for map rendering, when geocoded.
          properties:
            address:
              type: string
            lat:
              type: number
              format: double
              nullable: true
            lng:
              type: number
              format: double
              nullable: true


    JobDocument:
      type: object
      required: [id, name, size, contentType, downloadUrl]
      properties:
        id:
          type: integer
        name:
          type: string
        size:
          type: integer
          format: int64
        contentType:
          type: string
        createdAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          description: Relative URL the browser can fetch (cookie session auth).
