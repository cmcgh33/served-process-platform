        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - serverTier
        - active
        - jobsCompleted
        - payoutsEnabled
        - createdAt

    CreateServerBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        serverTier:
          type: string
          enum: [basic, pro, licensed]
        licenseNumber:
          type: string
        serviceArea:
          type: string
        businessAddress:
          type: string
        isLicensedNvServer:
          type: boolean
        licenseCounty:
          type: string
      required:
        - name
        - email
        - serverTier

    UpdateServerBody:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        serverTier:
          type: string
          enum: [basic, pro, licensed]
        licenseNumber:
          type: string
        serviceArea:
          type: string
        active:
          type: boolean
        businessAddress:
          type: string
        isLicensedNvServer:
          type: boolean
        licenseCounty:
          type: string

    UpdateMyServerProfileBody:
      type: object
      description: |
        Self-edit profile fields available to a server on the
        credentialing page. Mutates only Nevada-affidavit-relevant fields;
        Stripe state, server tier, and active flag are not editable here.
      properties:
        businessAddress:
          type: string
          description: Business address printed on Nevada affidavits.
        isLicensedNvServer:
          type: boolean
          description: |
            True if this server holds a Nevada PILB process-server work
            card. Drives the credentialing line that appears in the
            affidavit body.
        licenseNumber:
          type: string
        licenseCounty:
          type: string
          description: County of license — also used as the affidavit venue.
        serverType:
          type: string
          enum: [licensed_nv, registered, private, sheriff]
          description: Self-declared server classification (licensed_nv | registered | private | sheriff).
        photoUrl:
          type: string
          nullable: true
          description: Object-storage path of the server's profile headshot (from /storage/profile-photo/request-url). Send null to clear.

    ProfilePhotoUploadRequest:
